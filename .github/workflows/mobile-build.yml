name: Mobile CI/CD Pipelines (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. ANDROID BUILD JOB (APK & AAB Bundles)
  # =========================================================================
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Native Android Platform
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release Bundle (AAB for Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace || true

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tip-calculator-plus-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tip-calculator-plus-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # 2. iOS BUILD JOB (Xcode Workspace & Cloud IPA Compilation)
  # =========================================================================
  build-ios:
    name: Build iOS (Xcode Archive)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Native iOS Platform
        run: npx cap sync ios

      - name: Compile iOS Release Build (Unsigned .app)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Standalone iOS IPA File
        run: |
          mkdir -p ipa-output/Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" ipa-output/Payload/
          cd ipa-output
          zip -r Tip-Calculator-Plus.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tip-calculator-plus-ios-ipa
          path: ipa-output/Tip-Calculator-Plus.ipa
          if-no-files-found: warn
          retention-days: 14
